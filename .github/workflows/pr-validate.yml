# .github/workflows/pr-validate.yml
# Runs on every PR to main. Validates build, lints, and registry integrity.
# Pattern adapted from Managerial-Accounting's validator workflow.

name: PR Validation

on:
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate concept registry
        run: npm run validate:registry
        continue-on-error: false

      - name: Build (smoke test)
        run: npm run build
        env:
          BASE_URL: /Executive-Finance/
